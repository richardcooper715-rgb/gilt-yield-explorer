# Save this file as .github/workflows/update-data.yml in your repo
# (GitHub Actions only looks for workflow files in that exact folder).
#
# What it does:
#   - Runs every day at 07:00 UTC with `--only boe-latest`, a fast fetch
#     of just BoE's daily-updated "latest yield curve data" file -- this
#     is the only piece that actually changes day to day.
#   - Runs once a month (3rd, 08:00 UTC) with `--only all`, which also
#     re-fetches DMO + the BoE monthly archive zips -- this catches any
#     data revisions BoE makes and keeps everything in sync.
#   - Can also be triggered manually from the Actions tab any time, with
#     an optional "only" input if you want to run just one piece
#     (e.g. "dmo" after adding new dmo_raw/ files, or "boe-archive").
#   - If gilt_yields.json actually changed, commits and pushes it back
#     to the repo automatically, so GitHub Pages serves the fresh file
#     without you doing anything.
#
# One-time setup needed in your repo (in addition to this file):
#   1. Commit fetch_gilt_data.py to the repo root.
#   2. Commit the dmo_raw/ folder (your manually-downloaded DMO files)
#      to the repo root -- these are static and only need committing
#      once, this workflow just reuses them each run.

name: Update gilt yield data

on:
  schedule:
    - cron: '0 7 * * *'     # every day at 07:00 UTC -- fast, latest BoE data only
    - cron: '0 8 3 * *'     # 3rd of each month -- full run (archive refresh + revisions)
  workflow_dispatch:
    inputs:
      only:
        description: "Components to run: dmo, boe-archive, boe-latest (comma-separated) or 'all'"
        required: false
        default: 'all'

permissions:
  contents: write   # needed so the workflow can push the updated file

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 openpyxl xlrd pandas

      - name: Run data fetch script
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="--only ${{ github.event.inputs.only }}"
          elif [ "${{ github.event.schedule }}" = "0 8 3 * *" ]; then
            ARGS="--only all"
          else
            ARGS="--only boe-latest"
          fi
          echo "Running: python fetch_gilt_data.py $ARGS"
          python fetch_gilt_data.py $ARGS

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- gilt_yields.json; then
            echo "No changes to gilt_yields.json -- nothing to commit."
          else
            git add gilt_yields.json
            git commit -m "Auto-update gilt yield data ($(date -u +%Y-%m-%d))"
            git push
          fi
